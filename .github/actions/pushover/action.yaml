name: "Send Pushover Notification"
description: "Send a notification via Pushover API"
inputs:
  pushover_api_token:
    description: "Pushover API token"
    required: true
  pushover_user_key:
    description: "Pushover user key"
    required: true
  title:
    description: "Notification title"
    required: true
  message:
    description: "Notification message"
    required: true
runs:
  using: "composite"
  steps:
    - name: Send Pushover notification
      shell: bash
      env:
        PUSHOVER_API_TOKEN: ${{ inputs.pushover_api_token }}
        PUSHOVER_USER_KEY: ${{ inputs.pushover_user_key }}
        PUSHOVER_TITLE: ${{ inputs.title }}
        PUSHOVER_MESSAGE: ${{ inputs.message }}
      # Inputs travel as environment, never templated into the script text.
      run: '"$GITHUB_ACTION_PATH/../../../bin/ci-send-pushover"'
